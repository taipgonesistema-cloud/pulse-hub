version: '3.9'

services:
  postgres:
    image: postgres:16-bookworm
    container_name: pulse-hub-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulse_hub}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pulse_hub}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-bookworm
    container_name: pulse-hub-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  wa-core:
    build:
      context: .
      dockerfile: apps/wa-core/Dockerfile
    container_name: pulse-hub-wa-core
    environment:
      PORT: 3333
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/pulse_hub?sslmode=disable}
      WHATSMEOW_DATABASE_URL: ${WHATSMEOW_DATABASE_URL:-postgres://postgres:postgres@postgres:5432/pulse_hub?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AUTH_SEED_EMAIL: ${AUTH_SEED_EMAIL:-admin@pulsehub.local}
      AUTH_SEED_PASSWORD: ${AUTH_SEED_PASSWORD:-PulseHub123!}
      AUTH_SEED_NAME: ${AUTH_SEED_NAME:-Pulse Hub Admin}
      AUTH_SEED_ROLE: ${AUTH_SEED_ROLE:-admin}
    ports:
      - '3333:3333'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3333/health']
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3333}
    container_name: pulse-hub-web
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3333}
    ports:
      - '3000:3000'
    depends_on:
      wa-core:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
